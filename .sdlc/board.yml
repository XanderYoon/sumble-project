  - id: T005
    title: Wire search, health, readiness, and HTTP error contracts
    description: Implement the app factory, bounded body decoding, threaded database dispatch, typed output/docs,
      safe status mapping, and correlated non-200 logging.
    difficulty: medium
    depends_on:
    - T003
    - T004
    files:
    - src/sumble_api/app.py
    - src/sumble_api/observability.py
    - src/sumble_api/models.py
    - tests/test_api.py
    - tests/test_observability.py
    - tests/conftest.py
    prd_sections:
    - Users and key workflows
    - Interfaces, inputs, outputs, and error behavior
    - Acceptance scenarios and edge cases
    architecture_sections:
    - Public interfaces and contracts
    - Component responsibilities
    - Packaging, local execution, and verification
    acceptance:
    - POST /jobs/search accepts query-only/controlled requests, runs blocking DB calls off the event loop,
      and returns a bare Job array with generated request-ID header.
    - Bound actual streamed bytes to 16384 despite absent/false Content-Length and body reading to 5 seconds;
      reject unsupported type and malformed/overdeep JSON.
    - Map malformed JSON 400, slow body 408, oversized body 413, media type 415, validation 422, unavailable
      DB 503, timeout 504, and unexpected errors 500 to safe documented envelopes.
    - GET /health needs no DB; /ready checks schema and returns 200/503; /docs describes grammar, controls/defaults/bounds,
      responses, and examples.
    - Completed non-200 events include unknown routes, method errors, readiness failures, and exceptions;
      aborted requests are recorded separately.
    - No framework traceback, validation input echo, raw SQL/driver error, or credential leaks through
      responses/logs; imports remain connection-free.
    tests:
    - .venv/bin/python -m pytest -q tests/test_api.py tests/test_observability.py
    status: in_progress
    assigned_provider: openai
