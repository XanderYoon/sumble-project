  - id: T003
    title: Execute sorted paginated searches with bounded SQL timeouts
    description: Implement read-only execution, row hydration, cleanup, and schema readiness; verify semantics
      and controls in isolated real-Postgres fixtures.
    difficulty: medium
    depends_on:
    - T002
    files:
    - src/sumble_api/database.py
    - src/sumble_api/models.py
    - tests/conftest.py
    - tests/test_database.py
    - docs/database.md
    prd_sections:
    - Functional requirements
    - Nonfunctional requirements
    - Interfaces, inputs, outputs, and error behavior
    - Acceptance scenarios and edge cases
    architecture_sections:
    - Observed database schema
    - Public interfaces and contracts
    - Data flow and key constraints
    - Packaging, local execution, and verification
    acceptance:
    - Use standard PG variables, per-request connections, 3-second connection timeout, read-only transactions,
      and the validated transaction-local statement timeout.
    - Filter actual jobs, LEFT JOIN descriptive/sort fields, order all matches, then apply bound offset/limit;
      return unique nullable-source Job objects.
    - Map only four sort keys and asc/desc to fixed SQL with nulls last and ID ascending for non-ID ties;
      text uses source values/database collation.
    - Readiness checks connectivity and all required schema under a 2-second statement timeout without
      modifying assignment data.
    - Typed unavailable/timeout errors expose no driver messages; close/rollback connections on success,
      SQL failure, conversion failure, and timeout.
    - Integration tests opt in with SUMBLE_RUN_INTEGRATION=1 and PG settings; create/drop only a dedicated
      temporary schema, never public assignment rows.
    - Verify nesting, multi-value AND, duplicates, absent/null values, case/punctuation, injection literals,
      page continuity, all tied/null sorts, and beyond-end offsets against independent expected IDs.
    - Exercise true Postgres cancellation with a controlled slow fixture, not timing luck; verify cleanup
      and a subsequent successful search.
    tests:
    - .venv/bin/python -m pytest -q tests/test_database.py
    - env SUMBLE_RUN_INTEGRATION=1 .venv/bin/python -m pytest -q -m integration tests/test_database.py
