  - id: T006
    title: Bound concurrency and preserve cleanup on cancellation
    description: Add nonwaiting admission before body reading, independent readiness capacity, and cancellation-safe
      worker lifetime accounting under errors, overload, and disconnects.
    difficulty: high
    depends_on:
    - T005
    files:
    - src/sumble_api/app.py
    - src/sumble_api/database.py
    - tests/test_concurrency.py
    - tests/test_api.py
    - tests/test_database.py
    - tests/conftest.py
    prd_sections:
    - Nonfunctional requirements
    - Functional requirements
    - Acceptance scenarios and edge cases
    architecture_sections:
    - Packaging, local execution, and verification
    - Data flow and key constraints
    acceptance:
    - Default four admitted searches; allow MAX_CONCURRENT_SEARCHES integers 1–16 and fail startup on
      invalid deployment config.
    - Acquire capacity before body allocation with no waiting queue; excess searches get 503/server_busy,
      Retry-After 1, request IDs, and normal safe logging.
    - Readiness has one separately bounded DB operation, with no probe queue; /health stays independent
      and responsive under saturation.
    - Retain the search slot until worker/SQL and cleanup finish after cancellation/disconnect; disable
      worker-result abandonment and do not block the event loop.
    - Deterministic synchronization proves no more than the configured searches plus one readiness operation;
      do not rely on timing-only assertions.
    - Verify capacity/connection recovery after validation failure, slow upload, execution error, real
      SQL timeout, and cancellation, followed by success.
    tests:
    - .venv/bin/python -m pytest -q tests/test_concurrency.py tests/test_api.py
    - env SUMBLE_RUN_INTEGRATION=1 .venv/bin/python -m pytest -q -m integration tests/test_database.py
      tests/test_concurrency.py
