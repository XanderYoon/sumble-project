- id: E001
  title: Advanced Boolean job search API
  goal: Deliver a safe, bounded, Docker-runnable search API and verified submission ZIP against the supplied
    dataset.
  depends_on: []
  status: in_progress
  acceptance:
  - Nested AND/OR/NOT matches confirmed exact-name and missing-association semantics across all three
    fields.
  - Limit, offset, four-field sorting, and statement timeout honor approved defaults, bounds, and errors.
  - Four-search admission, bounded inputs, cleanup, safe non-200 logging, and persistent rotation are
    verified.
  - Both real-image curl examples work; default Apple AND .net completes in under 30 seconds after readiness.
  - A clean extracted submission ZIP starts with docker compose up --build and contains source, tests,
    packaging, and documentation.
  - All configured checks and an independent review of the exact final commit pass before a merge request.
  tickets:
  - id: T001
    title: Validate Boolean expressions and search controls
    description: Implement pure parse_query and safe validation errors for the complete raw envelope,
      using approved typed nodes/options and bounded tree traversal.
    difficulty: medium
    depends_on: []
    files:
    - src/sumble_api/query.py
    - src/sumble_api/models.py
    - tests/test_query.py
    prd_sections:
    - Functional requirements
    - Interfaces, inputs, outputs, and error behavior
    - Acceptance scenarios and edge cases
    architecture_sections:
    - Public interfaces and contracts
    - Component responsibilities
    acceptance:
    - Accept exactly leaves, nonempty AND/OR arrays, and unary NOT on all three allowed fields; reject
      ambiguous/extra keys and invalid shapes/types.
    - Enforce 16 levels, 128 nodes, and 256 characters per non-whitespace-only name, without unbounded
      validation recursion; do not trim valid literals.
    - Default controls to limit 10, offset 0, id ascending, timeout_ms 25000; independently default missing
      members of a present sort object.
    - Enforce limit 1–10, offset 0–100000, timeout_ms 1–25000 and four sort fields/asc-desc; reject bool/float/string/null
      integers and explicit null sort.
    - Test exact boundaries and over-limit input, punctuation/case preservation, and safe diagnostics
      that do not echo leaf values; parsing performs no database work.
    tests:
    - .venv/bin/python -m pytest -q tests/test_query.py
    status: done
