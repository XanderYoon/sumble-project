  - id: T004
    title: Implement safe structured error logging and rotation
    description: Implement logging setup and reusable safe event/correlation helpers, independent of Postgres,
      for the later HTTP boundary.
    difficulty: medium
    depends_on:
    - T003
    files:
    - src/sumble_api/observability.py
    - src/sumble_api/models.py
    - tests/test_observability.py
    prd_sections:
    - Nonfunctional requirements
    - Interfaces, inputs, outputs, and error behavior
    architecture_sections:
    - Component responsibilities
    - Public interfaces and contracts
    - Packaging, local execution, and verification
    acceptance:
    - JSON stdout and non-200 errors.jsonl events rotate at 5 MiB with three backups, without the query
      database.
    - Events contain UTC time, generated request ID, method, bounded normalized route, status, safe code,
      and duration; 4xx are warning and 5xx error.
    - Exclude bodies, query values, credentials, authorization headers, SQL values, raw driver/exception
      text, and locals; unexpected errors retain only safe class/frame information.
    - File failures produce safe stdout diagnostics without failing successful searches; repeated setup
      avoids duplicate handlers.
    - Test encoding/log forgery, bounds, secret-like input redaction, real rotation, file fallback, and
      request isolation.
