  - id: T002
    title: Compile Boolean trees into parameterized SQL sets
    description: Implement pure compilation into grouped SQL sets of job IDs using fixed normalized relationship
      templates and separately bound values.
    difficulty: medium
    depends_on:
    - T001
    files:
    - src/sumble_api/compiler.py
    - tests/test_compiler.py
    - src/sumble_api/query.py
    prd_sections:
    - Functional requirements
    - Nonfunctional requirements
    - Acceptance scenarios and edge cases
    architecture_sections:
    - Data flow and key constraints
    - Injection protections
    - Observed database schema
    acceptance:
    - Compile leaves using normalized organization/technology/function joins and lower(name) equality
      on bound literal values.
    - Parenthesized INTERSECT implements AND, UNION implements OR, and EXCEPT from all actual job IDs
      implements NOT of the entire child.
    - Distinct associations can satisfy separate technology leaves; set operations deduplicate IDs and
      retain missing associations under NOT.
    - Parameter order is deterministic; apostrophes, percent signs, and injection-like strings never become
      SQL syntax or identifiers.
    - Compilation opens no connection and uses no request-controlled SQL fragments or manual escaping.
    tests:
    - .venv/bin/python -m pytest -q tests/test_query.py tests/test_compiler.py
    status: done
