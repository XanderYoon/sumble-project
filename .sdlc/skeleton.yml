- path: README.md
  content: "# Sumble advanced queries\n\nStatus: code skeleton for review. Query validation, SQL generation, HTTP\
    \ routes,\nconcurrency controls, and logging are explicit NotImplementedError stubs.\nThe API is not functional\
    \ yet; do not use this scaffold as the submission ZIP.\n\nSee the [codebase flow diagram](docs/code-flow.md)\
    \ for the planned request path\nthrough the modules, including error handling, logging, and resource cleanup.\n\
    \n## Runtime and planned startup\n\nPython 3.14, FastAPI, Psycopg 3, and the supplied PostgreSQL Docker image.\n\
    Once implementation is complete, run `docker compose up --build`, then use\nhttp://127.0.0.1:8000/docs. Readiness:\
    \ `/ready`; liveness: `/health`.\nThe current factory stub deliberately prevents API startup.\n\n## Approved\
    \ request contract\n\nPOST `/jobs/search` with JSON. Success is a bare array of at most 10 jobs.\nQuery leaves\
    \ use field/value; operators are and/or arrays and unary not.\nNames match case-insensitive exact equality;\
    \ absent values satisfy NOT.\n\n```json\n{\n  \"query\": {\"field\": \"organization\", \"value\": \"apple\"\
    },\n  \"limit\": 10,\n  \"offset\": 0,\n  \"sort\": {\"field\": \"id\", \"direction\": \"asc\"},\n  \"timeout_ms\"\
    : 25000\n}\n```\n\nAll controls are optional. Limit: 1\u201310; offset: 0\u2013100000; timeout_ms: 1\u201325000\n\
    for database statement execution only. Sort fields: id, datetime_pulled,\njob_title, organization_name; direction\
    \ asc/desc; nulls last, ID ascending\nbreaks non-ID ties. Advance offset by limit. Cross-page snapshots are\
    \ not\nguaranteed if data changes. Defaults are shown above.\n\n## Development checks\n\nWith Python 3.14, install\
    \ `python -m pip install -r requirements-dev.txt`.\nRun `ruff format --check .`, `ruff check .`, `ty check`,\
    \ and\n`python -m pytest -q`. Current test coverage is import safety only;\nintegration and acceptance tests\
    \ arrive with their implementation tickets.\n\n## Required examples (available after implementation)\n\n```bash\n\
    curl --fail-with-body -sS -X POST http://127.0.0.1:8000/jobs/search \\\n  -H 'Content-Type: application/json'\
    \ \\\n  -d '{\"query\":{\"and\":[{\"field\":\"organization\",\"value\":\"apple\"},{\"field\":\"technology\"\
    ,\"value\":\".net\"}]}}'\n\ncurl --fail-with-body -sS -X POST http://127.0.0.1:8000/jobs/search \\\n  -H 'Content-Type:\
    \ application/json' \\\n  -d '{\"query\":{\"and\":[{\"not\":{\"field\":\"organization\",\"value\":\"apple\"\
    }},{\"or\":[{\"field\":\"job_function\",\"value\":\"statistician\"},{\"field\":\"technology\",\"value\":\"psql\"\
    }]}]}}'\n```\n\n## Optional database inspection\n\nDBeaver: PostgreSQL, host 127.0.0.1, port 5432, database\
    \ sumble_data,\nusername postgres, password supersecretpassword. These are assignment defaults.\nRuntime PG\
    \ settings are in Compose; readiness handles database availability.\nStop the temporary sumble-schema-inspection\
    \ container before starting Compose\nif it still owns port 5432. Do not stop unrelated containers.\n\n## Remaining\
    \ delivery documentation\n\nImplementation tickets will add nested-query, paging/sorting/timeout curl\nexamples,\
    \ full error/default/limit documentation, safe persistent log access\nand deletion instructions, test-database\
    \ setup, measured validation results,\nand submission ZIP packaging instructions.\n"
- path: docs/database.md
  content: |
    # Observed database

    Supplied image digest: sha256:714ff812e4d1ceb832ac41bc1a7d471cd5485fe14cb7a01b705909933a11097d.
    The dataset has 89397 jobs, 405050 technology relationships, 80811 function
    relationships, 9413 technologies, 170 functions, and five organizations.
    No indexes or declared constraints were observed.

    job_posts_details.id links to job_posts.id; organization_id links to
    organizations.id. job_posts_tech uses job_post_id and tech_id;
    job_posts_job_functions uses job_post_id and job_function_id. Dictionary
    names live in tech, job_functions, and organizations. Ignore denormalized
    text association columns. All observed entity IDs are unique bigint values.

    This inspection is evidence for the approved architecture, not a migration.
    Real SQL acceptance tests and schema documentation will be completed later.
- path: docs/validation.md
  content: |
    # Validation record

    Skeleton checks observed on Linux amd64 using CPython 3.14.10 in Docker:

    - Runtime and development dependency installations succeeded with pinned versions.
    - `docker compose config --quiet` passed.
    - `docker build -t sumble-skeleton:review .` passed.
    - `ruff format .` reported 18 files unchanged; the explicit format check also passed.
    - `ruff check .` passed.
    - `ty check` passed.
    - `python -m pytest -q` passed: one import-safety test, 0.43 seconds.

    Pinned quality tools: Ruff 0.17.3, ty 0.0.97, pytest 9.2.0. Runtime roots:
    FastAPI 0.162.0, Uvicorn 0.54.0, Psycopg/psycopg-binary 3.3.8,
    AnyIO 4.16.0, Pydantic 2.14.2. Dependency closures are in requirements files.
    The smoke test verifies that importing modules does not open a database;
    it does not exercise search behavior. The app factory and business functions
    are explicit NotImplementedError stubs, so API startup is not yet expected.

    No HTTP search performance or Boolean correctness is verified at this stage.
    A prior read-only SQL discovery probe for Apple AND .net returned three rows
    in 255.470 ms; this is not an API benchmark or evidence for the revised sort
    and pagination implementation. Final checks must use the supplied image and
    record environment, HTTP timing, concurrency behavior, and limitations.
