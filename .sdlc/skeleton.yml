version: 1
files:
- path: src/sumble_api/__init__.py
  content: |
    """Advanced Boolean search for the supplied Sumble dataset."""
- path: src/sumble_api/query.py
  content: |
    """Typed search contracts; runtime validation is implemented in a later ticket."""

    from __future__ import annotations

    from dataclasses import dataclass
    from typing import Literal

    type FilterField = Literal["technology", "job_function", "organization"]
    type SortField = Literal["id", "datetime_pulled", "job_title", "organization_name"]
    type SortDirection = Literal["asc", "desc"]

    DEFAULT_LIMIT = 10
    MAX_LIMIT = 10
    MAX_OFFSET = 100_000
    DEFAULT_TIMEOUT_MS = 25_000
    MAX_TIMEOUT_MS = 25_000
    MAX_BODY_BYTES = 16_384
    MAX_QUERY_NODES = 128
    MAX_QUERY_DEPTH = 16
    MAX_VALUE_LENGTH = 256


    class QueryValidationError(ValueError):
        """Signal invalid input with a safe message and validation path."""


    @dataclass(frozen=True)
    class Leaf:
        """Match a single allowlisted field and literal name."""

        field: FilterField
        value: str


    @dataclass(frozen=True)
    class Conjunction:
        """Require every child expression to match a job."""

        children: tuple[Expression, ...]


    @dataclass(frozen=True)
    class Disjunction:
        """Require at least one child expression to match a job."""

        children: tuple[Expression, ...]


    @dataclass(frozen=True)
    class Negation:
        """Match jobs absent from the child expression's result set."""

        child: Expression


    type Expression = Leaf | Conjunction | Disjunction | Negation


    @dataclass(frozen=True)
    class SearchOptions:
        """Hold validated paging, ordering, and SQL-timeout options."""

        limit: int = DEFAULT_LIMIT
        offset: int = 0
        sort_field: SortField = "id"
        sort_direction: SortDirection = "asc"
        timeout_ms: int = DEFAULT_TIMEOUT_MS


    @dataclass(frozen=True)
    class SearchRequest:
        """Hold a validated Boolean tree and immutable search options."""

        query: Expression
        options: SearchOptions = SearchOptions()


    def parse_query(payload: object) -> SearchRequest:
        """Validate decoded request data and apply documented control defaults.

        Args:
            payload: Entire decoded JSON envelope, including optional controls.

        Returns:
            A bounded expression tree and validated search options.

        Raises:
            QueryValidationError: A shape, type, name, or resource bound is invalid.
            NotImplementedError: Validation is not implemented in the skeleton.
        """
        raise NotImplementedError("Query validation is scheduled for implementation.")
- path: src/sumble_api/models.py
  content: |
    """Public job and error response shapes."""

    from datetime import datetime

    from pydantic import BaseModel


    class Job(BaseModel):
        """Describe a job with nullable source fields and a required identifier."""

        id: int
        organization_id: int | None = None
        organization_name: str | None = None
        job_title: str | None = None
        location: str | None = None
        country_id: int | None = None
        datetime_pulled: datetime | None = None


    class ErrorDetail(BaseModel):
        """Carry a safe failure description and server-generated correlation ID."""

        code: str
        message: str
        request_id: str
        path: str | None = None


    class ErrorResponse(BaseModel):
        """Wrap one public error without database diagnostics or credentials."""

        error: ErrorDetail
- path: src/sumble_api/compiler.py
  content: |
    """Contract for compiling validated expressions into parameterized SQL sets."""

    from dataclasses import dataclass

    from sumble_api.query import Expression


    @dataclass(frozen=True)
    class CompiledQuery:
        """Hold a job-ID SQL set and separate ordered parameter values."""

        sql: str
        parameters: tuple[object, ...]


    def compile_query(expression: Expression) -> CompiledQuery:
        """Compile a validated tree using fixed SQL fragments and bound values.

        Args:
            expression: Validated bounded Boolean expression.

        Returns:
            A SQL set of job IDs and parameters, without database execution.

        Raises:
            NotImplementedError: SQL compilation is not implemented in the skeleton.
        """
        raise NotImplementedError("SQL compilation is scheduled for implementation.")
- path: src/sumble_api/database.py
  content: |
    """Database boundary; importing this module never connects to PostgreSQL."""

    from sumble_api.models import Job
    from sumble_api.query import SearchRequest


    class DatabaseUnavailableError(RuntimeError):
        """Signal a connection or readiness failure without leaking driver details."""


    class SearchTimeoutError(TimeoutError):
        """Signal that PostgreSQL cancelled the search statement on timeout."""


    def search_jobs(request: SearchRequest) -> list[Job]:
        """Execute a read-only search using PG environment configuration.

        Args:
            request: Validated tree plus paging, sorting, and timeout options.

        Returns:
            Up to ten unique jobs in the requested order and offset.

        Raises:
            DatabaseUnavailableError: PostgreSQL cannot be reached.
            SearchTimeoutError: The bounded statement timeout is exceeded.
            NotImplementedError: Execution is not implemented in the skeleton.
        """
        raise NotImplementedError("Database search is scheduled for implementation.")


    def check_database() -> None:
        """Check connectivity and required schema using a bounded readiness query.

        Raises:
            DatabaseUnavailableError: The database or required schema is unavailable.
            NotImplementedError: Readiness is not implemented in the skeleton.
        """
        raise NotImplementedError("Database readiness is scheduled for implementation.")
- path: src/sumble_api/app.py
  content: |
    """HTTP application factory; importing this module starts no services."""

    from fastapi import FastAPI


    def create_app() -> FastAPI:
        """Construct search, health, readiness, and documentation routes.

        Returns:
            An application with bounded admission/body handling and safe error logging.

        Raises:
            ValueError: Deployment configuration is invalid.
            NotImplementedError: Routes are not implemented in the skeleton.
        """
        raise NotImplementedError("HTTP routes are scheduled for implementation.")
- path: src/sumble_api/observability.py
  content: |
    """Contract for safe structured logs and rotating persistent non-200 history."""

    from pathlib import Path


    def configure_logging(log_dir: Path) -> None:
        """Configure JSON stdout logs and rotating non-200 files.

        Args:
            log_dir: Persistent directory for errors.jsonl and three rotated backups.

        Returns:
            None; file-sink failures must fall back to stdout diagnostics.

        Raises:
            NotImplementedError: Logging is not implemented in the skeleton.
        """
        raise NotImplementedError("Safe logging is scheduled for implementation.")
- path: scripts/package.py
  content: |
    """Contract for packaging an explicit submission artifact allowlist."""

    from pathlib import Path


    def build_submission(output: Path) -> Path:
        """Package approved deliverable files without runtime or workflow artifacts.

        Args:
            output: Destination ZIP path.

        Returns:
            The completed ZIP path.

        Raises:
            FileNotFoundError: A required source artifact is missing.
            OSError: The archive cannot be written.
            NotImplementedError: Packaging is not implemented in the skeleton.
        """
        raise NotImplementedError("Submission packaging is scheduled for implementation.")
- path: tests/conftest.py
  content: |
