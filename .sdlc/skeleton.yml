- path: docs/code-flow.md
  content: "# Codebase request flow\n\nThis is the intended flow through the approved architecture. The current\n\
    application functions are skeleton stubs; these routes and calls are not yet\nimplemented. Solid arrows describe\
    \ the successful search path; dashed arrows\ndescribe rejection/error paths. Each traversal represents one request,\
    \ from\ningress to egress and a terminal node; responses do not loop back to the input.\n\n```mermaid\nflowchart\
    \ TD\n    START([\"Start: one client request\"]) --> INPUT[/\"Ingress / input: POST /jobs/search<br/>JSON query\
    \ + optional limit, offset, sort, timeout_ms\"/]\n    INPUT --> A[\"app.py: request ID and search admission<br/>Default:\
    \ 4 concurrent searches\"]\n    A --> B[\"app.py: bounded body read and JSON decoding<br/>16 KiB / 5 seconds\"\
    ]\n    B --> Q[\"query.py: parse_query(payload)<br/>Validate Boolean tree and controls; apply defaults\"]\n\
    \    Q --> T[\"app.py: dispatch database work to worker thread\"]\n\n    subgraph W[\"Worker thread: database.py\
    \ search_jobs(request)\"]\n        T --> K[\"compiler.py: compile_query(expression)<br/>AND: INTERSECT / OR:\
    \ UNION / NOT: EXCEPT\"]\n        K --> SQL[\"database.py: connect; begin read-only transaction<br/>Apply bounded\
    \ timeout; execute SQL + bound values\"]\n        SQL --> PG[(\"PostgreSQL: matching job IDs<br/>Join job details\
    \ and sort fields<br/>ORDER BY, then OFFSET and LIMIT\")]\n        PG --> J[\"models.py: Job objects\"]\n  \
    \      J --> CLEAN[\"database.py: close transaction and connection\"]\n        SQL -. \"connection failure /\
    \ timeout\" .-> FAIL[\"database.py: clean up before propagating failure\"]\n    end\n\n    CLEAN --> OK[\"app.py:\
    \ release search slot; serialize Job list\"]\n    OK --> SUCCESS[\"200: JSON array + request ID header\"]\n\
    \    SUCCESS --> OUTPUT[/\"Egress / output: HTTP response to client<br/>Status + JSON body + request ID header\"\
    /]\n\n    A -. \"capacity exhausted: 503\" .-> E[\"app.py + models.py: safe error response<br/>Code, message,\
    \ request ID; optional validation path\"]\n    B -. \"invalid JSON / body limit / read deadline\" .-> E\n  \
    \  Q -. \"invalid query or controls: 422\" .-> E\n    FAIL -. \"503 / 504\" .-> E\n    E --> RELEASE[\"app.py:\
    \ release any held slot<br/>After worker/database cleanup, if work started\"]\n    RELEASE --> LOG[\"observability.py:\
    \ record non-200 event<br/>JSON stdout + rotating app_logs volume\"]\n    LOG --> ERROR[\"Non-200 JSON response\
    \ + request ID header\"]\n    ERROR --> OUTPUT\n    OUTPUT --> FINISH([\"End: request complete\"])\n```\n\n\
    ## How the modules fit together\n\n| File | Responsibility on this path |\n| --- | --- |\n| `src/sumble_api/app.py`\
    \ | HTTP boundary, admission, body limits, dispatch, status mapping, response handling |\n| `src/sumble_api/query.py`\
    \ | Validate raw JSON into `SearchRequest(Expression, SearchOptions)` |\n| `src/sumble_api/compiler.py` | Build\
    \ a SQL set of job IDs and separate parameters from the expression |\n| `src/sumble_api/database.py` | Apply\
    \ connection/transaction/timeout settings; add allowlisted sort and bound page controls; execute and clean up\
    \ |\n| `src/sumble_api/models.py` | Define the public `Job`, `ErrorDetail`, and `ErrorResponse` shapes |\n|\
    \ `src/sumble_api/observability.py` | Configure safe logs and correlate non-200 events with response request\
    \ IDs |\n\n`compiler.py` does not execute SQL. `database.py` owns the database connection and\nthe full search\
    \ statement, including joins, sorting, and pagination. Sorting\nmust consider every matching job before offset/limit;\
    \ selecting ten IDs first\nwould produce incorrect custom-sort pages.\n\nThe HTTP layer remains async; Psycopg\
    \ work runs in a worker thread. A cancelled\nHTTP task cannot return its search slot while that thread still\
    \ runs SQL.\nCleanup finishes before capacity is released. Timeout defaults to 25,000 ms for\nthe database statement\
    \ only, with a client range of 1\u201325,000 ms. It is not an\nend-to-end HTTP deadline. Limit defaults/maxes\
    \ to 10; offset defaults to zero;\nsorting defaults to ID ascending, with nulls last and ID ascending for non-ID\
    \ ties.\n\nUnexpected server failures also pass through safe 500 handling and non-200\nlogging; the diagram\
    \ highlights the common validation/database branches.\nMiddleware also covers non-search errors such as unknown\
    \ routes and readiness\nfailures. No request bodies, query values, credentials, or raw driver errors go\ninto\
    \ error logs. Aborted requests are recorded separately if no response is sent.\n\n## Startup, health, and packaging\
    \ paths\n\n1. `docker-compose.yml` starts the supplied database and waits for its health check.\n2. `Dockerfile`\
    \ starts Uvicorn, which calls `app.py:create_app()` as a factory.\n3. The factory configures logging and routes;\
    \ `/health` checks process liveness\n   without consuming a search slot. `/ready` calls `database.py:check_database()`\n\
    \   with its own bounded readiness capacity and short database timeout.\n4. `scripts/package.py:build_submission(output)`\
    \ is an offline delivery path,\n   not an HTTP route. It will package source, configuration, tests, and docs\n\
    \   into a ZIP while excluding workflow/runtime artifacts.\n\nThe stub `create_app()` currently raises `NotImplementedError`;\
    \ building the\nimage succeeds, but a running API awaits the implementation tickets.\n\n## Verification map\n\
