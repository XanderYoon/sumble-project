# Quality rules for THIS SDLC skill's own Python tools and tests.
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C4", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.10"
extra-paths = ["./scripts"]

[tool.ty.src]
include = ["scripts", "tests"]

[tool.ty.rules]
import-not-found = "error"
invalid-assignment = "error"
invalid-return-type = "error"
unused-ignore-comment = "error"
