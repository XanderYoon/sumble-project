# Optional GitHub Actions template. Install in .github/workflows/python-quality.yml
# only after the project's structure and test setup are approved.
name: Python quality
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff format --check .
      - run: ruff check .
      - run: ty check
      - run: python -m pytest -q
